# VetData — stack completo (frontend + api + db).
# Uso:
#   docker compose -f infra/docker-compose.yml up --build
# Puertos host: 3000 web · 4000 api · 5435 postgres (5432-5434 los usan Forge/Synaptia).
# Nombre de proyecto fijo: nunca colisiona con otros stacks en carpetas "infra".
name: vetdata

services:
  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-mock}
        # URL pública para el navegador; api:4000 se reserva a tráfico interno.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://vetdata:vetdata@db:5432/vetdata}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-http://localhost:3000}
      - APP_ENV=${APP_ENV:-development}
      - SMTP_ADDR=${SMTP_ADDR:-}
      - SMTP_FROM=${SMTP_FROM:-VetData <noreply@example.test>}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_ALLOW_PLAIN=${SMTP_ALLOW_PLAIN:-false}
      - OUTBOX_KEY=${OUTBOX_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vetdata
      POSTGRES_PASSWORD: vetdata
      POSTGRES_DB: vetdata
    ports:
      - "5435:5432"
    volumes:
      - vetdata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetdata -d vetdata"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vetdata_postgres_data:
