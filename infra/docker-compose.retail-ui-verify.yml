# Ensayo desechable de escrituras de tienda y farmacia desde Next.js, aislado de vetdata.
# La base vive en tmpfs y los puertos solo escuchan en loopback.
name: vetdata-retail-ui-verify
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: retail_test
      POSTGRES_PASSWORD: disposable-only
      POSTGRES_DB: retail_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U retail_test -d retail_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  setup:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://retail_test:disposable-only@db:5432/retail_test?sslmode=disable
      BOOTSTRAP_GROUP_ID: 770e8400-e29b-41d4-a716-446655440001
      BOOTSTRAP_GROUP_NAME: Retail Fixture
      BOOTSTRAP_CLINIC_ID: 770e8400-e29b-41d4-a716-446655440002
      BOOTSTRAP_CLINIC_NAME: Retail Fixture Clinic
      BOOTSTRAP_SECTOR: Providencia
      BOOTSTRAP_ADDRESS: Calle de ensayo 1
      BOOTSTRAP_LEGAL_NAME: Retail Fixture Clinic
      BOOTSTRAP_RUT: 12345678-5
      BOOTSTRAP_NAME: Admin ensayo
      BOOTSTRAP_EMAIL: retail-ui@example.test
    entrypoint: [sh, -c]
    command: ["printf '%s\n' 'Disposable-only-password-123' | setup --admin"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ../backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://retail_test:disposable-only@db:5432/retail_test?sslmode=disable
      PUBLIC_WEB_URL: http://localhost:3100
      APP_ENV: development
    ports: ["127.0.0.1:4100:4000"]
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:4000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_DATA_SOURCE: http
        NEXT_PUBLIC_API_URL: http://localhost:4100
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      api: {condition: service_healthy}
