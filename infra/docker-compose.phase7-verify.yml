name: vetdata-phase7-verify
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: phase7_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: phase7_fixture
    volumes: [test_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U phase7_test -d phase7_fixture"]
      interval: 2s
      retries: 30
  setup:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://phase7_test:test-only@db:5432/phase7_fixture?sslmode=disable
      BOOTSTRAP_CLINIC_ID: 660e8400-e29b-41d4-a716-446655440002
      BOOTSTRAP_NAME: Recovery Fixture
      BOOTSTRAP_EMAIL: recovery@example.test
    entrypoint: [sh, -c]
    command: ["printf '%s\n' 'Fixture-password-123' | setup --seed-dev --admin"]
    depends_on:
      db: {condition: service_healthy}
  recovery:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: phase7_test
      PGDATABASE: phase7_fixture
    volumes: [./production:/ops:ro]
    tmpfs: [/backups]
    entrypoint: [sh, /ops/verify-recovery.sh]
    depends_on:
      setup: {condition: service_completed_successfully}
  restored-api:
    build: ../backend
    environment:
      APP_ENV: production
      SMTP_ADDR: unused.invalid:587
      OUTBOX_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://phase7_test:test-only@db:5432/phase7_restored?sslmode=disable
      PUBLIC_WEB_URL: https://localhost
      TRUSTED_PROXY_CIDRS: 172.30.78.2/32
    networks: [default, edge]
    depends_on:
      recovery: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:4000/healthz"]
      interval: 2s
      retries: 30
  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_DATA_SOURCE: http
        NEXT_PUBLIC_API_URL: ""
    networks: [edge]
    depends_on:
      restored-api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:3000/login"]
      interval: 2s
      retries: 30
  proxy:
    image: caddy:2.10.2-alpine
    volumes:
      - ./production/Caddyfile.verify:/etc/caddy/Caddyfile:ro
      - test_ca:/data
    networks:
      edge: {ipv4_address: 172.30.78.2}
    depends_on:
      restored-api: {condition: service_healthy}
      web: {condition: service_healthy}
  smoke:
    image: curlimages/curl:8.16.0
    user: "0:0"
    volumes:
      - test_ca:/caddy:ro
      - ./production/verify-https.sh:/verify.sh:ro
    networks: [edge]
    entrypoint: [sh, /verify.sh]
    depends_on: [proxy]
networks:
  edge:
    ipam:
      config: [{subnet: 172.30.78.0/24, ip_range: 172.30.78.128/25}]
volumes:
  test_ca:
  test_data:
